# Official FalkorDB image (with FalkorDB Browser on :3000) + Tracewise.
#   docker compose up --build      ->  http://localhost:8000   (browser: http://localhost:3000)
services:
  falkordb:
    image: falkordb/falkordb:latest
    ports: ["6379:6379", "3000:3000"]
    volumes: [falkordb-data:/var/lib/falkordb/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  tracewise:
    build: .
    depends_on:
      falkordb:
        condition: service_healthy
    ports: ["8000:8000"]
    environment:
      EMBEDDED_DB: "0"
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Tracewise-specific names, so an OPENAI_API_KEY set machine-wide by other tools can't override .env
      TRACEWISE_API_KEY: ${TRACEWISE_API_KEY:-}
      TRACEWISE_BASE_URL: ${TRACEWISE_BASE_URL:-}
      TRACEWISE_MODEL: ${TRACEWISE_MODEL:-}
      TRACEWISE_MODE: ${TRACEWISE_MODE:-}   # "offline" ignores any LLM keys

volumes:
  falkordb-data:
